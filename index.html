<script>

function showPage(pageId) {

  document.querySelectorAll('.page').forEach(p => {
    p.classList.remove('active');
  });

  document.getElementById(pageId).classList.add('active');

  if(pageId === 'bio') {
    startBioTyping();
  }
}

function startBioTyping() {

  const text = `kyuii (aka Kyuin chae)

artist


Hongik University BA
ENSAD de Paris


Group

Expo AR
Galerie du Crous de Paris
11 rue des Beaux-Arts,
75006 Paris, France

Expo
Art & Fashion:
Contemporary Art Walks the Runway

2014 Cube Museum,
Seongnam Arts Center,
Korea


Solo

einsteininseoul x Kyuii
2025 Sebin Gallery,
Seoul, Korea`;

  const el = document.getElementById("bioTyping");

  el.innerHTML = "";

  let i = 0;

  function type() {

    if(i < text.length) {

      if(text.charAt(i) === "\n") {
        el.innerHTML += "<br>";
      } else {
        el.innerHTML += text.charAt(i);
      }

      i++;

      setTimeout(type, 45);
    }
  }

  type();
}

</script>

<div id="bio" class="page">
  <p id="bioTyping"></p>
</div>
